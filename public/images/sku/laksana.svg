<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="laksanaGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b4d2e" />
      <stop offset="50%" stop-color="#143e24" />
      <stop offset="100%" stop-color="#0c2a17" />
    </linearGradient>
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="goldDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Trapezoid Board -->
  <polygon points="35,16 165,16 188,304 12,304" fill="url(#laksanaGreen)" stroke="url(#goldSheen)" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)" />
  
  <!-- Inner Border Line -->
  <polygon points="41,26 159,26 180,294 20,294" fill="none" stroke="url(#goldSheen)" stroke-width="2" stroke-opacity="0.8" stroke-linejoin="round" />

  <!-- Twin Coconut Shoots (Tunas Kelapa Kembar Emas) -->
  <g id="tunas-kembar" transform="translate(100, 142)">
    <!-- Left Coconut Shoot -->
    <g transform="translate(-32, 0)">
      <!-- Coconut Fruit / Seed -->
      <ellipse cx="0" cy="18" rx="14" ry="17" fill="url(#goldDark)" stroke="#fef08a" stroke-width="1.2" />
      <path d="M-8,14 Q0,26 8,14" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.6" />
      <!-- Sprout Stem -->
      <path d="M0,4 C0,-20 -6,-45 -12,-72 C-6,-62 0,-30 4,-5 C3,-1 2,2 0,4 Z" fill="url(#goldSheen)" />
      <!-- Primary Leaf Blade -->
      <path d="M-12,-72 C-2,-90 14,-65 2,-42 C-4,-55 -8,-64 -12,-72 Z" fill="url(#goldSheen)" />
      <!-- Side Leaf Blade 1 -->
      <path d="M-8,-48 C-20,-56 -24,-38 -10,-32 C-7,-37 -7,-44 -8,-48 Z" fill="url(#goldSheen)" />
      <!-- Side Leaf Blade 2 -->
      <path d="M-2,-30 C12,-38 18,-24 4,-16 C1,-20 -1,-25 -2,-30 Z" fill="url(#goldSheen)" />
      <!-- Rootlet Tip -->
      <path d="M-2,35 C-3,46 -8,52 -12,56 C-8,53 -4,47 0,38 Z" fill="url(#goldDark)" />
    </g>

    <!-- Right Coconut Shoot (Mirrored) -->
    <g transform="translate(32, 0) scale(-1, 1)">
      <!-- Coconut Fruit / Seed -->
      <ellipse cx="0" cy="18" rx="14" ry="17" fill="url(#goldDark)" stroke="#fef08a" stroke-width="1.2" />
      <path d="M-8,14 Q0,26 8,14" fill="none" stroke="#fef08a" stroke-width="1" opacity="0.6" />
      <!-- Sprout Stem -->
      <path d="M0,4 C0,-20 -6,-45 -12,-72 C-6,-62 0,-30 4,-5 C3,-1 2,2 0,4 Z" fill="url(#goldSheen)" />
      <!-- Primary Leaf Blade -->
      <path d="M-12,-72 C-2,-90 14,-65 2,-42 C-4,-55 -8,-64 -12,-72 Z" fill="url(#goldSheen)" />
      <!-- Side Leaf Blade 1 -->
      <path d="M-8,-48 C-20,-56 -24,-38 -10,-32 C-7,-37 -7,-44 -8,-48 Z" fill="url(#goldSheen)" />
      <!-- Side Leaf Blade 2 -->
      <path d="M-2,-30 C12,-38 18,-24 4,-16 C1,-20 -1,-25 -2,-30 Z" fill="url(#goldSheen)" />
      <!-- Rootlet Tip -->
      <path d="M-2,35 C-3,46 -8,52 -12,56 C-8,53 -4,47 0,38 Z" fill="url(#goldDark)" />
    </g>
  </g>

  <!-- Lower Text Plate -->
  <g transform="translate(100, 260)">
    <rect x="-70" y="-16" width="140" height="32" rx="4" fill="#0d351c" stroke="url(#goldSheen)" stroke-width="2" />
    <text x="0" y="7" font-family="'Arial Black', Impact, sans-serif" font-size="20" font-weight="900" fill="url(#goldSheen)" text-anchor="middle" letter-spacing="4">LAKSANA</text>
  </g>
</svg>
